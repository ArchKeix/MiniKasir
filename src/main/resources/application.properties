spring.application.name=kasir-spring
server.port=8080
spring.config.import=optional:file:.env[.properties]

# Spring AI via Naraya OpenAI-compatible API
spring.ai.openai.base-url=${NARAYA_BASE_URL:https://router.bynara.id}
spring.ai.openai.api-key=${NARAYA_API_KEY:}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${NARAYA_MODEL:gpt-6-luna}
spring.ai.openai.chat.options.temperature=0.2

# Koneksi PostgreSQL (bisa dioverride lewat environment variable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kasir}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}

# update: tabel dibuat/diperbarui otomatis, data tetap tersimpan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
