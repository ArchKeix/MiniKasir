<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kasir')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('kasir')}"></header>
<main>
    <h1>Kasir</h1>
    <div th:replace="~{fragments/layout :: pesan}"></div>

    <form th:action="@{/kasir/checkout}" method="post">
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Kode</th><th>Produk</th><th class="angka">Harga</th><th class="angka">Stok</th><th class="angka">Beli</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${daftar}">
                    <td th:text="${p.kode}"></td>
                    <td th:text="${p.nama}"></td>
                    <td class="angka" th:text="${'Rp ' + #numbers.formatDecimal(p.harga, 1, 'POINT', 0, 'COMMA')}"></td>
                    <td class="angka" th:text="${p.stok}"></td>
                    <td class="angka">
                        <input class="qty" type="number" min="0" th:max="${p.stok}" value="0"
                               th:name="${'qty_' + p.id}" th:attr="aria-label=${'Jumlah ' + p.nama}">
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(daftar)}"><td colspan="5" class="kosong">Tidak ada produk dengan stok tersedia.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="aksi-form">
            <button class="btn" type="submit" th:disabled="${#lists.isEmpty(daftar)}">Checkout</button>
        </div>
    </form>
</main>
</body>
</html>
