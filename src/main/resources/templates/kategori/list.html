<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kategori')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('kategori')}"></header>
<main>
    <h1>Kategori</h1>
    <div th:replace="~{fragments/layout :: pesan}"></div>

    <form class="card form-card" th:action="@{/kategori/simpan}" method="post">
        <div class="field">
            <label for="nama">Kategori baru</label>
            <input type="text" id="nama" name="nama" maxlength="50" placeholder="Contoh: Snack" required>
        </div>
        <button class="btn" type="submit">Tambah</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead><tr><th>Nama</th><th></th></tr></thead>
            <tbody>
            <tr th:each="k : ${daftar}">
                <td th:text="${k.nama}"></td>
                <td class="aksi">
                    <form class="inline" th:action="@{/kategori/{id}/hapus(id=${k.id})}" method="post"
                          onsubmit="return confirm('Hapus kategori ini?');">
                        <button class="btn bahaya kecil" type="submit">Hapus</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(daftar)}"><td colspan="2" class="kosong">Belum ada kategori.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
